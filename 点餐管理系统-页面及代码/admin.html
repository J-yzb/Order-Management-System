<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理后台</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<script>
const u = JSON.parse(localStorage.getItem('currentUser'));
if(!u || u.role !== 'admin'){
    alert('无权限访问，请使用管理员账号登录');
    location.href = 'login.html';
}
function logout(){
    localStorage.removeItem('currentUser');
    location.href = 'login.html';
}
</script>
<div class="flex min-h-screen">
    <!-- 左侧菜单 -->
    <aside class="w-56 bg-slate-900 text-white p-4">
        <h3 class="font-bold mb-6 text-lg">管理后台</h3>
        <button onclick="location.href='admin-order.html'" class="w-full text-left py-3 hover:bg-slate-700 rounded px-2">订单管理</button>
        <button onclick="location.href='admin-table.html'" class="w-full text-left py-3 hover:bg-slate-700 rounded px-2">预订审核</button>
        <button onclick="location.href='admin-dish.html'" class="w-full text-left py-3 hover:bg-slate-700 rounded px-2">菜品管理</button>
        <button onclick="location.href='stock.html'" class="w-full text-left py-3 hover:bg-slate-700 rounded px-2">库存物资管理</button>
        <button onclick="location.href='statistics.html'" class="w-full text-left py-3 hover:bg-slate-700 rounded px-2">经营统计</button>
        <button onclick="logout()" class="w-full text-left py-3 text-red-400 hover:bg-slate-700 rounded px-2 mt-6">退出登录</button>
    </aside>
    <!-- 右侧欢迎区 -->
    <main class="flex-1 p-8">
        <h2 class="text-2xl font-bold">欢迎进入管理控制台</h2>
        <p class="text-gray-500 mt-3">请在左侧菜单栏选择对应功能</p>
    </main>
</div>
</body>
</html>
