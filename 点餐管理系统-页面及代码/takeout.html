<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外卖订单</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gray-50">
<script>
const cur = JSON.parse(localStorage.getItem('currentUser'));
if (!cur) {
    alert('请先登录');
    location.href = 'login.html';
}
let addr = localStorage.getItem('takeoutAddr') || '';
let phone = localStorage.getItem('takeoutPhone') || '';
let cart = JSON.parse(localStorage.getItem('cart')) || [];
</script>

<nav class="bg-white shadow px-4 py-3 flex items-center sticky top-0">
    <button onclick="location.href='index.html'" class="text-gray-600 mr-3">
        <i class="fa fa-arrow-left"></i> 返回
    </button>
    <h3 class="font-bold text-orange-500">外卖订单确认</h3>
</nav>

<div class="p-4">
    <div class="bg-white rounded-lg shadow p-4 mb-4">
        <h4 class="font-semibold mb-2">配送信息</h4>
        <p class="text-sm mb-1"><span class="text-gray-500">配送地址：</span><span><script>document.write(addr)</script></span></p>
        <p class="text-sm"><span class="text-gray-500">联系电话：</span><span><script>document.write(phone)</script></span></p>
    </div>

    <div class="bg-white rounded-lg shadow p-4 mb-4">
        <h4 class="font-semibold mb-2">已选商品</h4>
        <div id="goodsList">
            <script>
                if(cart.length === 0){
                    document.write('<p class="text-gray-400 text-sm">暂无商品，请先去点餐</p>');
                }else{
                    let total = 0;
                    cart.forEach(item=>{
                        let sum = item.price * item.count;
                        total += sum;
                        document.write(`
                            <div class="flex justify-between text-sm py-2 border-b">
                                <div>${item.name} <span class="text-gray-400 ml-2">${item.taste}</span></div>
                                <div>x${item.count}  ¥${sum}</div>
                            </div>
                        `);
                    });
                    document.write(`
                        <div class="flex justify-between font-bold mt-3">
                            <span>订单总计</span>
                            <span class="text-orange-500">¥${total}</span>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>

    <div class="flex gap-3">
        <button onclick="location.href='index.html'" class="flex-1 py-2 border border-orange-500 text-orange-500 rounded-lg">继续点餐</button>
        <!-- 外卖订单跳转支付界面 -->
        <button onclick="location.href='pay.html'" class="flex-1 py-2 bg-orange-500 text-white rounded-lg">提交订单并支付</button>
    </div>
</div>
</body>
</html>
