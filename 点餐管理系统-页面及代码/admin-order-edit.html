<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>订单编辑</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<script>
const u = JSON.parse(localStorage.getItem('currentUser'));
if(!u || u.role !== 'admin'){
    alert('无权限');
    location.href='login.html';
}
function saveOrder(){
    alert('订单已保存');
    location.href='admin-order.html';
}
</script>
<nav class="bg-white shadow px-4 py-3 flex items-center">
    <button onclick="location.href='admin-order.html'" class="text-gray-600 mr-3"><i class="fa fa-arrow-left"></i> 返回</button>
    <h2 class="text-lg font-bold">订单编辑</h2>
</nav>
<div class="p-4 max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow p-4">
        <div class="mb-3">
            <label class="block text-sm mb-1">用户名称</label>
            <input type="text" class="w-full border px-2 py-2 rounded" placeholder="请输入用户名称">
        </div>
        <div class="mb-3">
            <label class="block text-sm mb-1">订单金额</label>
            <input type="number" class="w-full border px-2 py-2 rounded" placeholder="请输入金额">
        </div>
        <div class="mb-4">
            <label class="block text-sm mb-1">订单状态</label>
            <select class="w-full border px-2 py-2 rounded">
                <option>待支付</option>
                <option>已完成</option>
                <option>已取消</option>
            </select>
        </div>
        <button onclick="saveOrder()" class="w-full py-2 bg-orange-500 text-white rounded-lg">保存订单</button>
    </div>
</div>
</body>
</html>
