<script>
const cur = JSON.parse(localStorage.getItem('currentUser'));
if (!cur || cur.role === undefined) {
    alert('请先登录！');
    location.href = 'login.html';
}

// 加入购物车
function addToCart(name, price, type) {
    let count = prompt("请输入购买数量", 1);
    if (!count || isNaN(count) || count < 1) {
        alert("请输入有效的数量");
        return;
    }
    count = parseInt(count);

    let taste;
    if (type === 'drink') {
        taste = prompt("请选择：加冰/少冰/常温/热", "常温");
    } else {
        taste = prompt("请输入口味：不辣/微辣/少盐/正常", "正常");
    }
    if (taste === null) return;

    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const index = cart.findIndex(item => item.name === name && item.taste === taste);
    if (index >= 0) {
        cart[index].count += count;
    } else {
        cart.push({ name, price, count, taste });
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    alert(`${name}\n选择：${taste}\n数量：${count}\n已加入购物车`);
}

// 分类切换
function showCategory(cate) {
    document.querySelectorAll('.cate-item').forEach(el => el.classList.add('hidden'));
    document.getElementById(cate).classList.remove('hidden');
}

// 外卖跳转 填写地址电话
function goTakeout() {
    let address = prompt("请输入配送地址：", "");
    if (!address) {
        alert("配送地址不能为空！");
        return;
    }
    let phone = prompt("请输入联系电话：", "");
    if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
        alert("请输入有效的11位手机号码！");
        return;
    }
    localStorage.setItem('takeoutAddr', address);
    localStorage.setItem('takeoutPhone', phone);
    location.href = "takeout.html";
}
</script>

<!-- 轮播核心JS 放在页面底部 -->
<script>
let currentIndex = 0;
const totalSlides = 3;

// 更新轮播视图 + 指示器
function updateCarousel() {
    const inner = document.querySelector('.carousel-inner');
    const dots = document.querySelectorAll('.indicator');
    inner.style.transform = `translateX(-${currentIndex * 100}%)`;
    dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
    });
}

// 上一张
function prevSlide() {
    currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
    updateCarousel();
}

// 下一张
function nextSlide() {
    currentIndex = (currentIndex + 1) % totalSlides;
    updateCarousel();
}

// 点击小圆点跳转
function goToSlide(index) {
    currentIndex = index;
    updateCarousel();
}

// 页面加载完成初始化
window.onload = updateCarousel;
</script>
