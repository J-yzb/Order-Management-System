<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统登录</title>
<link rel="stylesheet" href="css/base.css" />
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-6 rounded-lg shadow-md w-80">
    <h2 class="text-xl font-bold text-center mb-4">系统登录</h2>
    <div class="mb-3">
        <label class="block text-sm mb-1">账号</label>
        <input type="text" id="username" class="w-full border px-2 py-1 rounded" placeholder="请输入账号">
    </div>
    <div class="mb-3">
        <label class="block text-sm mb-1">密码</label>
        <input type="password" id="pwd" class="w-full border px-2 py-1 rounded" placeholder="请输入密码">
    </div>
    <div class="mb-4">
        <label class="block text-sm mb-1">身份</label>
        <select id="role" class="w-full border px-2 py-1 rounded">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
        </select>
    </div>
    <button onclick="login()" class="w-full bg-orange-500 text-white py-2 rounded mb-3">登录</button>
    <p class="text-center text-sm text-gray-500">没有账号？<a href="register.html" class="text-orange-500">去注册</a></p>
</div>

<script>
const ADMIN_USER = "admin";
const ADMIN_PWD = "admin888";

function login(){
    let username = document.getElementById('username').value.trim();
    let pwd = document.getElementById('pwd').value.trim();
    let role = document.getElementById('role').value;

    if(!username || !pwd){
        alert('账号和密码不能为空');
        return;
    }

    // 管理员登录校验（固定账号）
    if(role === 'admin'){
        if(username === ADMIN_USER && pwd === ADMIN_PWD){
            localStorage.setItem('currentUser', JSON.stringify({username:username, role:'admin'}));
            location.href = 'admin.html';
        }else{
            alert('管理员账号或密码错误！');
        }
        return;
    }

    // 普通用户登录校验（必须已注册）
    if(!/^[0-9a-zA-Z]{6}$/.test(username) || !/^[0-9a-zA-Z]{8}$/.test(pwd)){
        alert('账号或密码格式错误！账号6位，密码8位，仅数字字母');
        return;
    }

    let users = JSON.parse(localStorage.getItem('regUsers')) || [];
    let user = users.find(u => u.username === username && u.password === pwd);
    if(user){
        localStorage.setItem('currentUser', JSON.stringify({username:username, role:'user'}));
        location.href = 'index.html';
    }else{
        alert('用户名或密码错误，或账号未注册！');
    }
}
</script>
</body>
</html>
